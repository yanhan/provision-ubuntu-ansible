---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: git@github.com:jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ["-i", "2", "-sr"]
        exclude: |
          (?x)^(
            roles/system/files/install-nvm-0.39.7.sh
          )$
      - id: shellcheck
        exclude: |
          (?x)^(
            roles/system/files/install-nvm-0.39.7.sh
          )
